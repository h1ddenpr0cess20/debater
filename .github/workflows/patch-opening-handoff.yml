name: Patch opening handoff

on:
  push:
    branches: [agent/fix-opening-handover]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch debate handoff races
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/client/debate/director.js')
          s = p.read_text()

          old = '''    /** Already answering, or already asked and about to: one at a time. */
    if (pending[id] || them.busy || them.state === 'speaking') return false;
    queued[id] = null;
'''
          new = '''    /**
     * A handoff can arrive while the target is still finishing a previous
     * response. Dropping that ask leaves the debate with nobody owning the
     * next turn, which is the intermittent post-opening stall. Normal turns
     * queue; an interruption is deliberately not queued because it is only
     * useful while the speaker is still talking.
     */
    if (pending[id] || them.busy || them.state === 'speaking') {
      if (retry) queued[id] = { direction };
      return false;
    }
    queued[id] = null;
'''
          if old not in s:
              raise SystemExit('ask guard not found')
          s = s.replace(old, new, 1)

          old = '''  function handOver(to, { direction } = {}) {
    clearTimeout(heardTimer);
    if (heardIt[to]) return ask(to, { direction });

    waitingOn = to;
'''
          new = '''  function handOver(to, { direction } = {}) {
    clearTimeout(heardTimer);
    const target = roster[to];
    if (!target?.connected || phase !== 'running') return false;
    /** Preserve the handoff if the target is still finishing an older answer. */
    if (pending[to] || target.busy || target.state === 'speaking') {
      queued[to] = { direction };
      return true;
    }
    if (heardIt[to]) return ask(to, { direction });

    waitingOn = to;
'''
          if old not in s:
              raise SystemExit('handOver guard not found')
          s = s.replace(old, new, 1)

          old = '''    const them = roster[other(speaker)];
    if (!them?.connected || them.busy || them.state === 'speaking') return false;
'''
          new = '''    const them = roster[other(speaker)];
    if (!them?.connected || pending[them.id] || them.busy || them.state === 'speaking') return false;
'''
          if old not in s:
              raise SystemExit('cut-in guard not found')
          s = s.replace(old, new, 1)

          old = '''  function cutIn(speaker) {
    const id = other(speaker);
    lastCut = turns;
    /** Both gates open for a moment: they talk over each other, as people do.
     *  The speaker's own turn detection is what cuts their answer short. */
    bus.relay(id, speaker, true);
    emit('interrupt', { id, over: speaker });
    ask(id, { direction: DIRECTION.interject, retry: false });
  }
'''
          new = '''  function cutIn(speaker) {
    if (!heckling || phase !== 'running' || floor !== speaker) return false;
    const id = other(speaker);
    const target = roster[id];
    /** Never open the return gate unless this exact target owns the response. */
    if (!target?.connected || pending[id] || target.busy || target.state === 'speaking') return false;
    if (!ask(id, { direction: DIRECTION.interject, retry: false })) return false;

    lastCut = turns;
    /** Both gates open only after the target has been given the turn. */
    bus.relay(id, speaker, true);
    emit('interrupt', { id, over: speaker });
    return true;
  }
'''
          if old not in s:
              raise SystemExit('cutIn body not found')
          s = s.replace(old, new, 1)

          old = '''    set heckling(on) { heckling = Boolean(on); },
'''
          new = '''    set heckling(on) {
      heckling = on === true;
      if (!heckling) {
        rolledAt = 0;
        lastCut = turns;
      }
    },
'''
          if old not in s:
              raise SystemExit('heckling setter not found')
          s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Commit patch and remove patch workflow
        run: |
          rm .github/workflows/patch-opening-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/debate/director.js .github/workflows/patch-opening-handoff.yml
          git commit -m 'Fix cut-in response races'
          git push
