name: Patch moderator handoff

on:
  push:
    branches: [agent/fix-opening-handover]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch moderator handoff race
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/client/debate/director.js')
          s = p.read_text()
          old = '''    /** Whoever was mid-answer is talked over, which is a moderator's privilege. */
    for (const agent of agents) {
      if (agent.id === target) continue;
      agent.cancel();
      pending[agent.id] = false;
    }

    clearTimeout(handTimer);
    handTimer = 0;
    floor = null;
    route(target);

    /**
     * The one being asked may be mid-answer too — a question put over the top
     * of them replaces it. Their answer has to actually be gone before the next
     * can be asked for, so this waits for its `done` rather than racing it.
     */
    if (roster[target]?.busy) {
      queued[target] = {};
      roster[target].cancel();
      return true;
    }

    ask(target);
'''
          new = '''    /** A moderator interruption invalidates every other pending turn. */
    for (const agent of agents) {
      if (agent.id === target) continue;
      agent.cancel();
      pending[agent.id] = false;
      queued[agent.id] = null;
    }

    clearTimeout(handTimer);
    handTimer = 0;
    clearTimeout(heardTimer);
    heardTimer = 0;
    waitingOn = null;
    asked = null;
    floor = null;
    route(target);

    /**
     * Never issue a new response while the target still owns an old one.
     * Cancellation completes asynchronously, so queue the moderator's turn
     * and let the target's `done` event make exactly one response.create.
     */
    const targetAgent = roster[target];
    if (pending[target] || targetAgent?.busy || targetAgent?.state === 'speaking') {
      queued[target] = {};
      targetAgent?.cancel();
      return true;
    }

    queued[target] = null;
    ask(target);
'''
          if old not in s:
              raise SystemExit('moderator handoff block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-moderator-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/client/debate/director.js .github/workflows/patch-moderator-handoff.yml
          git commit -m 'Serialize moderator interruptions'
          git push
