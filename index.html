<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0c10">
<meta name="description" content="Two voice agents — an egg and a potato — argue politics at each other across two podiums, each one hearing the other as if it were a person.">
<meta name="mobile-web-app-capable" content="yes">
<title>Debater — two voice agents, two podiums</title>
<style>
/* Keep the caption layer above the WebGL canvas. The canvas is explicitly z-indexed. */
#floor { position: relative; z-index: 1; }
</style>
</head>
<body>
<div id="top">
<header id="bar">
  <div id="phase" class="chip" data-phase="idle">idle</div>
  <div id="meters">
    <span id="meter-turns" class="chip">0/0 turns</span>
    <span id="meter-clock" class="chip">0:00</span>
    <span id="meter-tokens" class="chip">0 tok</span>
  </div>
  <p id="motion"></p>
  <p id="notice" role="status"></p>
</header>

<three-d-stage name="debate" background="#0b0c10"></three-d-stage>

<div id="floor">
  <p id="mod" class="chip" data-live="false"><span class="dot"></span>moderator</p>

  <section class="lectern" data-debater="potato" data-state="idle" data-floor="false">
    <p class="who chip"><span class="name">Tater</span><span class="party">Democrat</span><span class="state">idle</span></p>
    <div class="caption" aria-live="polite"></div>
  </section>

  <section class="lectern" data-debater="egg" data-state="idle" data-floor="false">
    <p class="who chip"><span class="name">Marc</span><span class="party">Republican</span><span class="state">idle</span></p>
    <div class="caption" aria-live="polite"></div>
  </section>
</div>
</div>

<div id="tabs">
    <button id="toolbox-toggle" class="chip" type="button" aria-expanded="false"
            aria-controls="toolbox">tools</button>
    <button id="connectors-toggle" class="chip" type="button" aria-expanded="false"
            aria-controls="connectors">connectors</button>
    <button id="log-toggle" class="chip" type="button" aria-expanded="false"
            aria-controls="log">log</button>
</div>

<form id="controls">
  <div id="motion-row">
    <button id="mic" type="button" aria-pressed="false" aria-label="Open the moderator microphone">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <rect x="5.4" y="1.4" width="4.2" height="7.6" rx="2.1" stroke="currentColor" stroke-width="1.4"/>
        <path d="M3 7.2a4.5 4.5 0 0 0 9 0M7.5 11.7v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path class="slash" d="M2.6 12.4 12.4 2.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>

    <input id="topic" type="text" autocomplete="off" autocapitalize="sentences" enterkeyhint="go"
           placeholder="What are they arguing about?" aria-label="The motion">

    <button id="shuffle" class="ghost chip" type="button" aria-label="Pick a motion for me">pick one</button>
    <button id="start" type="submit">debate</button>

    <button id="pause" class="round" type="button" aria-pressed="false" disabled
            aria-label="Pause the debate" title="Pause (space)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <g class="bars"><path d="M5.6 3v9M9.4 3v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
        <path class="play" d="M4.6 3.2 12 7.5l-7.4 4.3z" fill="currentColor"/>
      </svg>
    </button>

    <button id="stop" class="round" type="button" disabled
            aria-label="Hang both calls up" title="Stop (esc)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true">
        <rect x="3.6" y="3.6" width="7.8" height="7.8" rx="1.6" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div id="options">
    <select id="model" class="chip" aria-label="Model"><option>loading…</option></select>
    <div id="voices"></div>
    <button id="heckle" class="chip" type="button" aria-pressed="true"
            aria-label="Whether they may talk over each other">cut-ins on</button>
    <select id="cap-turns" class="chip cap" aria-label="Turn limit">
      <option value="4">4 turns</option>
      <option value="6">6 turns</option>
      <option value="8">8 turns</option>
      <option value="10">10 turns</option>
      <option value="12" selected>12 turns</option>
      <option value="16">16 turns</option>
      <option value="20">20 turns</option>
      <option value="30">30 turns</option>
    </select>
    <select id="cap-minutes" class="chip cap" aria-label="Time limit">
      <option value="2">2 min</option>
      <option value="4">4 min</option>
      <option value="6">6 min</option>
      <option value="8" selected>8 min</option>
      <option value="12">12 min</option>
      <option value="16">16 min</option>
      <option value="20">20 min</option>
      <option value="30">30 min</option>
    </select>
  </div>
</form>

<section id="log" hidden aria-label="Past debates">
  <header id="log-head">
    <span class="chip">log</span>
    <button id="log-new" class="chip" type="button">new</button>
    <button id="log-clear" class="chip" type="button">clear</button>
    <button id="log-close" class="chip" type="button" aria-label="Close the log">close</button>
  </header>
  <div id="log-list"></div>
</section>

<section id="toolbox" hidden aria-label="Tools the debaters can use">
  <header id="toolbox-head">
    <span class="chip">tools</span>
    <button id="toolbox-close" class="chip" type="button" aria-label="Close tools">close</button>
  </header>
  <ul id="toolbox-list"></ul>
  <p id="toolbox-note" class="chip">A switch here applies to both lecterns.</p>
</section>

<section id="connectors" hidden aria-label="Connectors">
  <header id="connectors-head">
    <span class="chip">connectors</span>
    <button id="connectors-save" class="chip" type="button" disabled>save</button>
    <button id="connectors-close" class="chip" type="button" aria-label="Close connectors">close</button>
  </header>
  <div id="connectors-body">
    <div id="connectors-list"></div>
    <p id="connectors-note" class="chip"></p>
  </div>
</section>

<script type="module" src="/src/client/main.js"></script>
</body>
</html>
